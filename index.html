<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nauka Słówek po Angielsku</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fffbf5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Baloo 2', cursive;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; top: -120px; left: -120px;
    width: 450px; height: 450px;
    background: radial-gradient(circle, #ffe0b2 0%, transparent 70%);
    border-radius: 50%;
    z-index: 0;
    animation: blob1 9s ease-in-out infinite alternate;
  }
  body::after {
    content: '';
    position: fixed; bottom: -100px; right: -100px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, #bbdefb 0%, transparent 70%);
    border-radius: 50%;
    z-index: 0;
    animation: blob2 11s ease-in-out infinite alternate;
  }
  @keyframes blob1 { from { transform: translate(0,0) scale(1); } to { transform: translate(50px,70px) scale(1.1); } }
  @keyframes blob2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-40px,-60px) scale(1.15); } }

  .page {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px 60px;
  }

  header {
    width: 100%;
    background: linear-gradient(135deg, #ff7043 0%, #ff9800 40%, #42a5f5 100%);
    padding: 40px 20px 32px;
    text-align: center;
    border-radius: 0 0 48px 48px;
    box-shadow: 0 8px 32px rgba(255,112,67,0.25);
    margin-bottom: 40px;
  }
  header .stars { font-size: 1.6rem; letter-spacing: 6px; margin-bottom: 8px; }
  header h1 {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: clamp(2rem, 7vw, 3.4rem);
    color: white;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.12);
    letter-spacing: -1px;
    line-height: 1.1;
  }
  header .subtitle {
    color: rgba(255,255,255,0.9);
    font-size: 1.05rem;
    margin-top: 6px;
    font-weight: 600;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 28px;
    width: 100%;
    max-width: 720px;
  }

  .topic-card {
    background: white;
    border-radius: 28px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.09);
    padding: 36px 28px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: inherit;
    transition: transform .25s, box-shadow .25s;
    border: 3px solid transparent;
    position: relative;
    overflow: hidden;
    animation: cardIn .5s ease both;
  }
  .topic-card:nth-child(1) { animation-delay: .05s; border-color: #ffccbc; }
  .topic-card:nth-child(2) { animation-delay: .15s; border-color: #bbdefb; }
  .topic-card:nth-child(3) { animation-delay: .25s; border-color: #c8e6c9; }
  .topic-card:nth-child(4) { animation-delay: .35s; border-color: #e1bee7; }

  .topic-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 7px;
    border-radius: 28px 28px 0 0;
  }
  .topic-card:nth-child(1)::before { background: linear-gradient(90deg, #ff7043, #ffca28); }
  .topic-card:nth-child(2)::before { background: linear-gradient(90deg, #1e88e5, #ab47bc); }
  .topic-card:nth-child(3)::before { background: linear-gradient(90deg, #2e7d32, #26a69a); }
  .topic-card:nth-child(4)::before { background: linear-gradient(90deg, #ab47bc, #ec407a); }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .topic-card:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 20px 48px rgba(0,0,0,0.14);
  }

  .topic-emoji {
    font-size: 4rem;
    line-height: 1;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
  }

  .topic-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 1.7rem;
    color: #333;
    text-align: center;
  }

  .topic-desc {
    font-size: 0.95rem;
    color: #888;
    text-align: center;
    font-weight: 600;
    line-height: 1.4;
  }

  .topic-count {
    font-size: 0.85rem;
    font-weight: 700;
    padding: 5px 16px;
    border-radius: 50px;
  }
  .topic-card:nth-child(1) .topic-count { background: #fff3e0; color: #e65100; }
  .topic-card:nth-child(2) .topic-count { background: #e3f2fd; color: #1565c0; }
  .topic-card:nth-child(3) .topic-count { background: #e8f5e9; color: #2e7d32; }
  .topic-card:nth-child(4) .topic-count { background: #f3e5f5; color: #7b1fa2; }

  .topic-btn {
    font-family: 'Baloo 2', cursive;
    font-size: 1.05rem;
    font-weight: 800;
    color: white;
    border: none;
    border-radius: 50px;
    padding: 11px 32px;
    cursor: pointer;
    margin-top: 4px;
    transition: all .2s;
    letter-spacing: 0.3px;
  }
  .topic-card:nth-child(1) .topic-btn {
    background: linear-gradient(135deg, #ff7043, #ff9800);
    box-shadow: 0 4px 16px rgba(255,112,67,0.4);
  }
  .topic-card:nth-child(2) .topic-btn {
    background: linear-gradient(135deg, #1e88e5, #42a5f5);
    box-shadow: 0 4px 16px rgba(30,136,229,0.4);
  }
  .topic-card:nth-child(3) .topic-btn {
    background: linear-gradient(135deg, #2e7d32, #26a69a);
    box-shadow: 0 4px 16px rgba(46,125,50,0.4);
  }
  .topic-card:nth-child(4) .topic-btn {
    background: linear-gradient(135deg, #ab47bc, #ec407a);
    box-shadow: 0 4px 16px rgba(171,71,188,0.4);
  }
  .topic-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }

  @media (max-width: 480px) {
    .cards-grid { grid-template-columns: 1fr; gap: 20px; }
    header { padding: 32px 16px 26px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="stars">⭐🌍📚🌍⭐</div>
    <h1>Nauka Słówek</h1>
    <div class="subtitle">Wybierz temat i ćwicz angielski!</div>
  </header>

  <div class="cards-grid">
    <a href="food.html" class="topic-card">
      <div class="topic-emoji">🍎</div>
      <div class="topic-title">Food We Eat</div>
      <div class="topic-desc">Jedzenie i produkty spożywcze</div>
      <div class="topic-count">14 słówek</div>
      <button class="topic-btn">Ćwicz teraz!</button>
    </a>

    <a href="games.html" class="topic-card">
      <div class="topic-emoji">🏃</div>
      <div class="topic-title">Games & Activities</div>
      <div class="topic-desc">Zabawy i aktywności fizyczne</div>
      <div class="topic-count">10 słówek</div>
      <button class="topic-btn">Ćwicz teraz!</button>
    </a>

    <a href="animals.html" class="topic-card">
      <div class="topic-emoji">🐘</div>
      <div class="topic-title">Wild Animals</div>
      <div class="topic-desc">Dzikie zwierzęta z całego świata</div>
      <div class="topic-count">8 słówek</div>
      <button class="topic-btn">Ćwicz teraz!</button>
    </a>

    <a href="toys.html" class="topic-card">
      <div class="topic-emoji">🎮</div>
      <div class="topic-title">Toys & Games</div>
      <div class="topic-desc">Zabawki i gry dla dzieci</div>
      <div class="topic-count">8 słówek</div>
      <button class="topic-btn">Ćwicz teraz!</button>
    </a>
  </div>
</div>
</body>
</html>
