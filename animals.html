<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animals – Nauka Słówek</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0faf4;
    --primary: #43a047;
    --secondary: #26a69a;
    --accent: #ffb300;
    --yellow: #ffca28;
    --purple: #ab47bc;
    --card-bg: #ffffff;
    --shadow: 0 8px 32px rgba(0,0,0,0.10);
    --radius: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Baloo 2', cursive;
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; top: -100px; left: -100px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, #c8e6c9 0%, transparent 70%);
    border-radius: 50%;
    z-index: 0;
    animation: blobMove 8s ease-in-out infinite alternate;
  }
  body::after {
    content: '';
    position: fixed; bottom: -80px; right: -80px;
    width: 350px; height: 350px;
    background: radial-gradient(circle, #b2dfdb 0%, transparent 70%);
    border-radius: 50%;
    z-index: 0;
    animation: blobMove2 10s ease-in-out infinite alternate;
  }
  @keyframes blobMove { from { transform: translate(0,0) scale(1); } to { transform: translate(40px,60px) scale(1.1); } }
  @keyframes blobMove2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-30px,-50px) scale(1.15); } }

  #app { position: relative; z-index: 1; }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #2e7d32 0%, #43a047 50%, #26a69a 100%);
    padding: 28px 20px 22px;
    text-align: center;
    border-radius: 0 0 40px 40px;
    box-shadow: 0 6px 24px rgba(67,160,71,0.3);
  }
  header h1 {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: clamp(2rem, 6vw, 3rem);
    color: white;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.15);
    letter-spacing: -1px;
  }
  header .subtitle {
    color: rgba(255,255,255,0.9);
    font-size: 1rem;
    margin-top: 4px;
    font-weight: 600;
  }
  .stars { font-size: 1.4rem; letter-spacing: 4px; }

  /* MODE SELECTOR */
  .mode-bar {
    display: flex;
    justify-content: center;
    gap: 16px;
    padding: 24px 20px 10px;
    flex-wrap: wrap;
  }
  .mode-btn {
    font-family: 'Baloo 2', cursive;
    font-size: 1.1rem;
    font-weight: 700;
    border: 3px solid transparent;
    border-radius: 50px;
    padding: 10px 28px;
    cursor: pointer;
    transition: all .2s;
    outline: none;
  }
  .mode-btn.easy {
    background: #e8f5e9;
    color: #388e3c;
    border-color: #a5d6a7;
  }
  .mode-btn.easy.active, .mode-btn.easy:hover {
    background: #66bb6a;
    color: white;
    border-color: #388e3c;
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(102,187,106,0.4);
  }
  .mode-btn.hard {
    background: #fce4ec;
    color: #c62828;
    border-color: #ef9a9a;
  }
  .mode-btn.hard.active, .mode-btn.hard:hover {
    background: #ef5350;
    color: white;
    border-color: #b71c1c;
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(239,83,80,0.4);
  }
  .mode-label {
    font-size: 0.75rem;
    opacity: 0.75;
    display: block;
    font-weight: 400;
  }

  /* SCORE BAR */
  .score-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding: 8px 20px;
    font-size: 1.1rem;
    font-weight: 700;
    color: #555;
  }
  .score-pill {
    background: white;
    border-radius: 50px;
    padding: 6px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    color: var(--primary);
    font-size: 1.2rem;
    font-weight: 800;
  }
  .progress-pill {
    background: white;
    border-radius: 50px;
    padding: 6px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    color: var(--secondary);
    font-size: 1rem;
    font-weight: 700;
  }

  /* WORD GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    padding: 20px 24px 30px;
    max-width: 860px;
    margin: 0 auto;
  }

  /* WORD CARD */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 16px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    transition: transform .2s, box-shadow .2s;
    animation: cardIn .4s ease both;
    border: 3px solid transparent;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    border-radius: 24px 24px 0 0;
  }
  .card:nth-child(4n+1)::before { background: var(--primary); }
  .card:nth-child(4n+2)::before { background: var(--secondary); }
  .card:nth-child(4n+3)::before { background: var(--accent); }
  .card:nth-child(4n+4)::before { background: var(--purple); }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,0.14); }
  .card.correct { border-color: var(--primary); background: #f1f8f1; }
  .card.wrong { border-color: #ef5350; background: #fff5f5; animation: shake .4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%,60% { transform: translateX(-6px); }
    40%,80% { transform: translateX(6px); }
  }

  .card-emoji {
    font-size: 5rem;
    line-height: 1;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
  }

  /* LETTER INPUTS */
  .letter-row {
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: center;
    gap: 4px;
    width: 100%;
  }

  .letter-box {
    width: 32px;
    height: 38px;
    border: 2px solid #a5d6a7;
    border-radius: 8px;
    text-align: center;
    font-family: 'Baloo 2', cursive;
    font-size: 1.2rem;
    font-weight: 700;
    color: #333;
    background: #f1f8f1;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
    caret-color: var(--primary);
    flex-shrink: 0;
  }
  .letter-box:focus {
    border-color: var(--secondary);
    box-shadow: 0 0 0 3px rgba(38,166,154,0.25);
    background: #e0f2f1;
  }
  .letter-box.filled-hint {
    color: #26a69a;
    font-weight: 800;
    background: #e0f2f1;
    border-color: #4db6ac;
  }

  .letter-space {
    width: 8px;
    flex-shrink: 0;
  }

  .word-input {
    width: 100%;
    max-width: 180px;
    height: 44px;
    border: 2.5px solid #d0d0d0;
    border-radius: 12px;
    text-align: center;
    font-family: 'Baloo 2', cursive;
    font-size: 1.2rem;
    font-weight: 700;
    color: #333;
    background: white;
    outline: none;
    padding: 0 12px;
    transition: border-color .15s, box-shadow .15s;
  }
  .word-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(67,160,71,0.2);
  }
  .word-input::placeholder { color: #bbb; font-weight: 400; font-size: 1rem; }

  .card-status {
    font-size: 1.4rem;
    min-height: 1.6rem;
  }

  .check-btn {
    font-family: 'Baloo 2', cursive;
    font-size: 1rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--secondary), #00897b);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 8px 22px;
    cursor: pointer;
    transition: all .2s;
    box-shadow: 0 3px 10px rgba(38,166,154,0.35);
  }
  .check-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(38,166,154,0.45); }
  .check-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

  .hint {
    font-size: 0.85rem;
    color: #e53935;
    font-weight: 600;
    text-align: center;
    min-height: 1.1rem;
  }

  /* FOOTER BUTTONS */
  .footer {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding: 10px 24px 40px;
    flex-wrap: wrap;
  }
  .btn-finish {
    font-family: 'Baloo 2', cursive;
    font-size: 1.2rem;
    font-weight: 800;
    background: linear-gradient(135deg, #43a047, #26a69a);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 14px 40px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(67,160,71,0.4);
    transition: all .2s;
    letter-spacing: 0.5px;
    display: none;
  }
  .btn-finish:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(67,160,71,0.5); }

  .btn-restart {
    font-family: 'Baloo 2', cursive;
    font-size: 1rem;
    font-weight: 700;
    background: white;
    color: #666;
    border: 2px solid #ddd;
    border-radius: 50px;
    padding: 12px 28px;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-restart:hover { background: #f5f5f5; border-color: #bbb; transform: translateY(-2px); }

  /* RESULTS SCREEN */
  #results {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
    text-align: center;
    padding: 40px 24px;
    gap: 20px;
    animation: fadeIn .6s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform: scale(0.95); } to { opacity:1; transform: scale(1); } }
  #results .big-emoji { font-size: 5rem; animation: bounce 1s ease infinite alternate; }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-16px); } }
  #results h2 { font-family: 'Nunito', sans-serif; font-size: 2.5rem; font-weight: 900; color: #333; }
  #results .score-display {
    font-size: 3.5rem;
    font-weight: 900;
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  #results p { font-size: 1.1rem; color: #666; max-width: 340px; }
  .btn-play-again {
    font-family: 'Baloo 2', cursive;
    font-size: 1.3rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--primary), #2e7d32);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 16px 48px;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(67,160,71,0.4);
    transition: all .2s;
    margin-top: 10px;
  }
  .btn-play-again:hover { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(67,160,71,0.5); }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; gap: 14px; padding: 14px; }
    .card-emoji { font-size: 3.5rem; }
    .letter-box { width: 27px; height: 32px; font-size: 1rem; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stars">🐍🐸🦜🐘🦒</div>
    <h1>Wild Animals</h1>
    <div class="subtitle">Naucz się słówek po angielsku! 🌍</div>
    <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;font-family:'Baloo 2',cursive;font-weight:700;font-size:1rem;color:white;text-decoration:none;background:rgba(255,255,255,0.25);border-radius:50px;padding:6px 18px;margin-top:12px;transition:background .2s;">← Powrót do menu</a>
  </header>

  <div class="mode-bar">
    <button class="mode-btn easy active" onclick="setMode('easy')">
      🟩 Łatwy
      <span class="mode-label">z kratkami</span>
    </button>
    <button class="mode-btn hard" onclick="setMode('hard')">
      🔴 Trudny
      <span class="mode-label">bez kratek</span>
    </button>
  </div>

  <div class="score-bar">
    <span>⭐ Punkty:</span>
    <span class="score-pill" id="scoreDisplay">0</span>
    <span>📝 Słówka:</span>
    <span class="progress-pill" id="progressDisplay">0 / 8</span>
  </div>

  <div class="grid" id="wordGrid"></div>

  <div class="footer">
    <button class="btn-restart" onclick="restartGame()">🔄 Zacznij od nowa</button>
    <button class="btn-finish" onclick="finishGame()">🏁 Zakończ i sprawdź wynik</button>
  </div>

  <div id="results">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Świetnie!</h2>
    <div class="score-display" id="resultScore">8 / 8</div>
    <p id="resultMsg">Znakomita robota! Uczysz się bardzo dobrze!</p>
    <button class="btn-play-again" onclick="restartGame()">🎮 Zagraj jeszcze raz</button>
  </div>
</div>

<script>
const WORDS = [
  { word: 'snake',     emoji: '🐍', img: 'https://images.unsplash.com/photo-1516728778615-2d590ea1855e?w=200&h=200&fit=crop&crop=center' },
  { word: 'frog',      emoji: '🐸', img: 'https://images.unsplash.com/photo-1551189014-fe516c09df22?w=200&h=200&fit=crop&crop=center' },
  { word: 'parrot',    emoji: '🦜', img: 'https://images.unsplash.com/photo-1552728089-57bdde30beb3?w=200&h=200&fit=crop&crop=center' },
  { word: 'elephant',  emoji: '🐘', img: 'https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?w=200&h=200&fit=crop&crop=center' },
  { word: 'monkey',    emoji: '🐒', img: 'https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?w=200&h=200&fit=crop&crop=center' },
  { word: 'mouse',     emoji: '🐭', img: 'https://images.unsplash.com/photo-1425082661705-1834bfd09dca?w=200&h=200&fit=crop&crop=center' },
  { word: 'giraffe',   emoji: '🦒', img: 'https://images.unsplash.com/photo-1547721064-da6cfb341d50?w=200&h=200&fit=crop&crop=center' },
  { word: 'crocodile', emoji: '🐊', img: 'https://images.unsplash.com/photo-1598439210625-5067c578f3f6?w=200&h=200&fit=crop&crop=center' },
];

let mode = 'easy';
let score = 0;
let answered = new Set();

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.mode-btn.' + m).classList.add('active');
  restartGame();
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function buildLetterInputs(word, cardEl, idx) {
  const row = cardEl.querySelector('.letter-row');
  row.innerHTML = '';

  if (mode === 'hard') {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'word-input';
    input.placeholder = '✏️ wpisz słowo...';
    input.autocomplete = 'off';
    input.autocorrect = 'off';
    input.spellcheck = false;
    input.dataset.wordIdx = idx;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') checkWord(idx); });
    row.appendChild(input);

  } else {
    const parts = word.split(' ');
    parts.forEach((part, pi) => {
      if (pi > 0) {
        const sp = document.createElement('span');
        sp.className = 'letter-space';
        row.appendChild(sp);
      }
      for (let i = 0; i < part.length; i++) {
        const input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 1;
        input.className = 'letter-box';
        input.dataset.expected = part[i].toLowerCase();
        input.dataset.wordIdx = idx;
        input.dataset.partIdx = pi;
        input.dataset.charIdx = i;
        input.autocomplete = 'off';
        input.autocorrect = 'off';
        input.spellcheck = false;
        input.addEventListener('input', e => handleInputEasy(e, idx));
        input.addEventListener('keydown', e => handleKeydownEasy(e, idx));
        row.appendChild(input);
      }
    });
  }
}

function handleInputEasy(e, wordIdx) {
  const inp = e.target;
  const val = inp.value.replace(/[^a-zA-Z]/g, '');
  inp.value = val.slice(-1);
  if (inp.value) {
    const all = getAllBoxesForCard(wordIdx);
    const ci = all.indexOf(inp);
    if (ci < all.length - 1) all[ci + 1].focus();
  }
}

function handleKeydownEasy(e, wordIdx) {
  const inp = e.target;
  const all = getAllBoxesForCard(wordIdx);
  const ci = all.indexOf(inp);
  if (e.key === 'Backspace' && !inp.value && ci > 0) {
    all[ci - 1].focus();
    all[ci - 1].value = '';
  }
  if (e.key === 'Enter') checkWord(wordIdx);
}

function getAllBoxesForCard(wordIdx) {
  return Array.from(document.querySelectorAll(`.letter-box[data-word-idx="${wordIdx}"]`));
}

function checkWord(idx) {
  if (answered.has(idx)) return;
  const word = WORDS[idx].word;
  const card = document.getElementById('card-' + idx);
  const expected = word.toLowerCase().replace(/ /g, '');

  let given = '';
  if (mode === 'hard') {
    const inp = card.querySelector('.word-input');
    given = (inp.value || '').toLowerCase().replace(/ /g, '');
  } else {
    const boxes = getAllBoxesForCard(idx);
    given = boxes.map(i => i.value.toLowerCase()).join('');
  }

  const hintEl = card.querySelector('.hint');
  const statusEl = card.querySelector('.card-status');
  const btn = card.querySelector('.check-btn');

  if (given === expected) {
    card.classList.add('correct');
    statusEl.textContent = '✅';
    hintEl.textContent = '';
    btn.disabled = true;
    if (mode === 'hard') {
      const inp = card.querySelector('.word-input');
      inp.disabled = true;
      inp.style.background = '#e8f5e9';
      inp.style.borderColor = '#a5d6a7';
      inp.style.color = '#2e7d32';
    } else {
      getAllBoxesForCard(idx).forEach(i => {
        i.disabled = true;
        i.style.background = '#e8f5e9';
        i.style.borderColor = '#a5d6a7';
        i.style.color = '#2e7d32';
      });
    }
    score++;
    answered.add(idx);
    updateUI();
  } else {
    card.classList.add('wrong');
    setTimeout(() => card.classList.remove('wrong'), 500);
    statusEl.textContent = '❌';
    hintEl.textContent = 'Poprawna: ' + word;
    if (mode === 'hard') {
      const inp = card.querySelector('.word-input');
      inp.focus(); inp.select();
    } else {
      const firstEmpty = getAllBoxesForCard(idx).find(i => !i.value);
      if (firstEmpty) firstEmpty.focus();
    }
  }
}

function updateUI() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('progressDisplay').textContent = answered.size + ' / ' + WORDS.length;
}

function renderGame() {
  const grid = document.getElementById('wordGrid');
  grid.innerHTML = '';
  grid.className = 'grid ' + mode;

  const shuffled = shuffle(WORDS.map((w, i) => ({ ...w, origIdx: i })));

  shuffled.forEach((item, displayIdx) => {
    const idx = WORDS.findIndex(w => w.word === item.word);
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + idx;
    card.style.animationDelay = (displayIdx * 0.06) + 's';

    card.innerHTML = `
      <div class="card-emoji">${item.emoji}</div>
      <div class="letter-row"></div>
      <div class="card-status"></div>
      <div class="hint"></div>
      <button class="check-btn" onclick="checkWord(${idx})">✔ Sprawdź</button>
    `;

    grid.appendChild(card);
    buildLetterInputs(item.word, card, idx);
  });

  document.getElementById('wordGrid').style.display = '';
  document.querySelector('.footer').style.display = '';
  document.getElementById('results').style.display = 'none';
  updateUI();
}

function restartGame() {
  score = 0;
  answered = new Set();
  renderGame();
}

function finishGame() {
  const total = WORDS.length;
  const pct = Math.round((score / total) * 100);

  let emoji, title, msg;
  if (pct === 100) { emoji = '🏆'; title = 'Doskonale!'; msg = 'Wszystkie słówka poprawnie! Jesteś mistrzem!'; }
  else if (pct >= 70) { emoji = '🎉'; title = 'Świetnie!'; msg = 'Bardzo dobrze! Trochę więcej ćwiczeń i będziesz idealny!'; }
  else if (pct >= 40) { emoji = '💪'; title = 'Nieźle!'; msg = 'Dobry start! Ćwicz dalej, a będzie coraz lepiej!'; }
  else { emoji = '📚'; title = 'Ćwicz więcej!'; msg = 'Nie poddawaj się! Każda próba to postęp!'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultScore').textContent = score + ' / ' + total;
  document.getElementById('resultMsg').textContent = msg;

  document.getElementById('wordGrid').style.display = 'none';
  document.querySelector('.footer').style.display = 'none';
  document.getElementById('results').style.display = 'flex';
}

// Init
renderGame();
</script>
</body>
</html>
