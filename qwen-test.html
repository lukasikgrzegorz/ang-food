<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            border: 2px solid #444;
            background: linear-gradient(180deg, #0a0a2e 0%, #1a1a3e 50%, #0d0d2d 100%);
            overflow: hidden;
        }
        
        #player {
            position: absolute;
            bottom: 20px;
            left: 380px;
            width: 40px;
            height: 50px;
            background: linear-gradient(180deg, #4CAF50 0%, #2E7D32 100%);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            transition: left 0.05s ease;
        }
        
        .bullet {
            position: absolute;
            width: 4px;
            height: 15px;
            background: #FFEB3B;
            border-radius: 2px;
            box-shadow: 0 0 10px #FFEB3B;
        }
        
        .enemy {
            position: absolute;
            width: 35px;
            height: 35px;
            background: linear-gradient(180deg, #f44336 0%, #c62828 100%);
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        }
        
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 18px;
            z-index: 100;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #FFEB3B;
            padding: 40px;
            text-align: center;
            color: white;
            display: none;
        }
        
        #gameOver h2 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #FFEB3B;
        }
        
        #gameOver button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 5px;
        }
        
        #gameOver button:hover {
            background: #66BB6A;
        }
        
        .explosion {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFEB3B 0%, #FF9800 50%, transparent 100%);
            animation: explode 0.5s ease-out forwards;
        }
        
        @keyframes explode {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <span>Wynik: <span id="score">0</span></span>
            <span>Życia: <span id="lives">3</span></span>
            <span>Fala: <span id="wave">1</span></span>
        </div>
        <div id="player"></div>
        <div id="gameOver">
            <h2>KONIEC GRY</h2>
            <p>Twój wynik: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">Zagraj Ponownie</button>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('gameContainer');
        const player = document.getElementById('player');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const waveElement = document.getElementById('wave');
        const gameOverScreen = document.getElementById('gameOver');
        
        let score = 0;
        let lives = 3;
        let wave = 1;
        let gameRunning = true;
        let playerX = 380;
        let bullets = [];
        let enemies = [];
        let stars = [];
        let keys = {};
        
        // Create stars background
        function createStars() {
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 800 + 'px';
                star.style.top = Math.random() * 600 + 'px';
                star.style.opacity = Math.random();
                gameContainer.appendChild(star);
                stars.push({
                    element: star,
                    y: parseFloat(star.style.top),
                    speed: Math.random() * 2 + 0.5
                });
            }
        }
        
        // Move player
        function movePlayer() {
            if (keys['ArrowLeft'] || keys['a']) {
                playerX = Math.max(0, playerX - 8);
            }
            if (keys['ArrowRight'] || keys['d']) {
                playerX = Math.min(760, playerX + 8);
            }
            player.style.left = playerX + 'px';
        }
        
        // Shoot bullet
        function shoot() {
            if (!gameRunning) return;
            
            const bullet = document.createElement('div');
            bullet.className = 'bullet';
            bullet.style.left = (playerX + 18) + 'px';
            bullet.style.bottom = '70px';
            gameContainer.appendChild(bullet);
            
            bullets.push({
                element: bullet,
                y: 530,
                x: playerX + 18
            });
        }
        
        // Create enemy
        function createEnemy() {
            const enemy = document.createElement('div');
            enemy.className = 'enemy';
            enemy.style.left = Math.random() * 760 + 'px';
            enemy.style.top = '-40px';
            gameContainer.appendChild(enemy);
            
            enemies.push({
                element: enemy,
                y: -40,
                x: parseFloat(enemy.style.left),
                speed: 2 + wave * 0.5
            });
        }
        
        // Update bullets
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.y -= 8;
                bullet.element.style.bottom = (600 - bullet.y) + 'px';
                
                if (bullet.y < 0) {
                    bullet.element.remove();
                    bullets.splice(i, 1);
                }
            }
        }
        
        // Update enemies
        function updateEnemies() {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.y += enemy.speed;
                enemy.element.style.top = enemy.y + 'px';
                
                // Check collision with bullets
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const bullet = bullets[j];
                    if (bullet.x > enemy.x && bullet.x < enemy.x + 35 &&
                        bullet.y > enemy.y && bullet.y < enemy.y + 35) {
                        // Hit!
                        createExplosion(enemy.x, enemy.y);
                        enemy.element.remove();
                        bullet.element.remove();
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        score += 10;
                        scoreElement.textContent = score;
                        break;
                    }
                }
                
                // Check if enemy reached bottom
                if (enemy.y > 560) {
                    enemy.element.remove();
                    enemies.splice(i, 1);
                    lives--;
                    livesElement.textContent = lives;
                    
                    if (lives <= 0) {
                        gameOver();
                    }
                }
            }
        }
        
        // Create explosion effect
        function createExplosion(x, y) {
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.style.left = x + 'px';
            explosion.style.top = y + 'px';
            gameContainer.appendChild(explosion);
            
            setTimeout(() => explosion.remove(), 500);
        }
        
        // Update stars
        function updateStars() {
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > 600) {
                    star.y = 0;
                }
                star.element.style.top = star.y + 'px';
            });
        }
        
        // Game loop
        function gameLoop() {
            if (!gameRunning) return;
            
            movePlayer();
            updateBullets();
            updateEnemies();
            updateStars();
            
            requestAnimationFrame(gameLoop);
        }
        
        // Enemy spawner
        function spawnEnemies() {
            if (!gameRunning) return;
            
            createEnemy();
            
            // Increase difficulty with waves
            const spawnRate = Math.max(500, 1500 - wave * 100);
            setTimeout(spawnEnemies, spawnRate);
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            gameOverScreen.style.display = 'block';
        }
        
        // Restart game
        function restartGame() {
            // Clear all elements
            bullets.forEach(b => b.element.remove());
            enemies.forEach(e => e.element.remove());
            
            bullets = [];
            enemies = [];
            score = 0;
            lives = 3;
            wave = 1;
            playerX = 380;
            gameRunning = true;
            
            scoreElement.textContent = score;
            livesElement.textContent = lives;
            waveElement.textContent = wave;
            gameOverScreen.style.display = 'none';
            
            spawnEnemies();
            gameLoop();
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') {
                shoot();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // Start game
        createStars();
        spawnEnemies();
        gameLoop();
    </script>
</body>
</html>
